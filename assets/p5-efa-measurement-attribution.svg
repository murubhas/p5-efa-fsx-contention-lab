<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#14213d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowEnd" markerWidth="12" markerHeight="10" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L0,8 L11,4 z" fill="context-stroke"/>
    </marker>
    <marker id="arrowStart" markerWidth="12" markerHeight="10" refX="1" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M11,0 L11,8 L0,4 z" fill="context-stroke"/>
    </marker>
    <style>text { letter-spacing: 0; }</style>
  </defs>
  <rect width="1800" height="1320" fill="#fbfcfe"/>

  <text x="900" y="54" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="38" font-weight="800" fill="#14213d">How we separated NCCL and checkpoint traffic on one EFA fabric</text>
  <text x="900" y="90" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="19" font-weight="700" fill="#53627a">Three controlled 90-second arms plus synchronized before/after evidence</text>
  <rect x="1515" y="22" width="235" height="43" rx="21" fill="#edf9f1" stroke="#149447" stroke-width="2"/>
  <text x="1632" y="49" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="800" fill="#149447">REPRODUCIBLE METHOD</text>

  <rect x="48" y="122" width="1704" height="208" rx="15" fill="#edf2ff" stroke="#3767e8" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="76" y="157" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="25" font-weight="800" fill="#3767e8">Controlled topology held constant</text>
  <rect x="78" y="177" width="376" height="118" rx="12" fill="#ffffff" stroke="#3767e8" stroke-width="2.5" filter="url(#softShadow)"/><text x="96" y="208" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#3767e8">P5 worker A</text><text x="96" y="236" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="96" dy="0">8 H100 | 32 EFA devices</tspan><tspan x="96" dy="21">ranks 0-7 | writer target: GPU 0</tspan></text>
  <rect x="508" y="177" width="376" height="118" rx="12" fill="#ffffff" stroke="#13a9c6" stroke-width="2.5" filter="url(#softShadow)"/><text x="526" y="208" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#13a9c6">P5 worker B</text><text x="526" y="236" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="526" dy="0">8 H100 | 32 EFA devices</tspan><tspan x="526" dy="21">ranks 8-15 | writer target: GPU 0</tspan></text>
  <line x1="454" y1="236" x2="505" y2="236" stroke="#6748d6" stroke-width="6" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="480" y="211" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="800" fill="#6748d6">NCCL</text>
  <rect x="948" y="177" width="370" height="118" rx="12" fill="#ffffff" stroke="#f1a208" stroke-width="2.5" filter="url(#softShadow)"/><text x="966" y="208" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#f1a208">Dedicated /fsx-efa</text><text x="966" y="236" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="966" dy="0">Persistent 2 | EFA enabled</tspan><tspan x="966" dy="21">Lustre 2.15 | same AZ</tspan></text>
  <line x1="884" y1="236" x2="944" y2="236" stroke="#f1a208" stroke-width="6" marker-end="url(#arrowEnd)"/>
  <text x="914" y="211" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="800" fill="#f1a208">GDS</text>
  <rect x="1380" y="177" width="340" height="118" rx="12" fill="#ffffff" stroke="#149447" stroke-width="2.5" filter="url(#softShadow)"/><text x="1398" y="208" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#149447">Same test contract</text><text x="1398" y="236" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="1398" dy="0">same nodes and duration</tspan><tspan x="1398" dy="21">same payloads and runner versions</tspan></text>

  <text x="48" y="379" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="27" font-weight="800" fill="#14213d">Three arms create the attribution boundary</text>
  <rect x="48" y="404" width="530" height="240" rx="15" fill="#f4f0ff" stroke="#6748d6" stroke-width="3" filter="url(#softShadow)"/>
  <text x="76" y="444" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="25" font-weight="800" fill="#6748d6">A. NCCL only</text>
  <text x="76" y="481" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="700" fill="#14213d"><tspan x="76" dy="0">16 ranks repeat validated all-reduce</tspan><tspan x="76" dy="26">256 MiB tensor per rank</tspan><tspan x="76" dy="26">AWS Libfabric + GDRDMA required</tspan></text>
  <line x1="110" y1="578" x2="504" y2="578" stroke="#6748d6" stroke-width="7" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="307" y="557" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#6748d6">peer H100 traffic</text>
  <text x="307" y="620" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#6748d6">Signature: rdma_write_bytes dominated</text>

  <rect x="635" y="404" width="530" height="240" rx="15" fill="#fff8df" stroke="#f1a208" stroke-width="3" filter="url(#softShadow)"/>
  <text x="663" y="444" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="25" font-weight="800" fill="#f1a208">B. Checkpoint only</text>
  <text x="663" y="481" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="700" fill="#14213d"><tspan x="663" dy="0">one GDS writer per worker</tspan><tspan x="663" dy="26">GPU 0 | 4 gdsio threads | fallback off</tspan><tspan x="663" dy="26">H100 -&gt; cuFile -&gt; Lustre -&gt; FSx</tspan></text>
  <line x1="685" y1="578" x2="1115" y2="578" stroke="#f1a208" stroke-width="7" marker-end="url(#arrowEnd)"/>
  <text x="900" y="557" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#f1a208">GPU-to-filesystem traffic</text>
  <text x="900" y="620" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#f1a208">Signature: rdma_read_resp_bytes dominated</text>

  <rect x="1222" y="404" width="530" height="240" rx="15" fill="#fff1f1" stroke="#d83742" stroke-width="3" filter="url(#softShadow)"/>
  <text x="1250" y="444" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="25" font-weight="800" fill="#d83742">C. Synchronized overlap</text>
  <text x="1250" y="481" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="700" fill="#14213d"><tspan x="1250" dy="0">same NCCL and GDS parameters</tspan><tspan x="1250" dy="26">one shared future UTC start epoch</tspan><tspan x="1250" dy="26">only intended change: concurrency</tspan></text>
  <line x1="1280" y1="578" x2="1472" y2="578" stroke="#6748d6" stroke-width="6" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <line x1="1500" y1="578" x2="1692" y2="578" stroke="#f1a208" stroke-width="6" marker-end="url(#arrowEnd)"/>
  <text x="1376" y="557" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="800" fill="#6748d6">NCCL</text>
  <text x="1596" y="557" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="800" fill="#f1a208">GDS</text>
  <text x="1486" y="620" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#d83742">Both counter signatures appear</text>

  <text x="48" y="696" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="27" font-weight="800" fill="#14213d">Every arm uses the same evidence timeline</text>
  <rect x="48" y="722" width="1704" height="142" rx="14" fill="#ffffff" stroke="#7a8baa" stroke-width="2.5" filter="url(#softShadow)"/>
  <rect x="78" y="746" width="300" height="91" rx="11" fill="#ffffff" stroke="#3767e8" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="107" cy="774" r="17" fill="#3767e8"/><text x="107" y="780" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">1</text><text x="132" y="776" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">Before snapshot</text><text x="96" y="806" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="96" dy="0">UTC | EFA | LNet</tspan><tspan x="96" dy="17">nvidia_fs</tspan></text>
  <line x1="386" y1="792" x2="482" y2="792" stroke="#3767e8" stroke-width="4" marker-end="url(#arrowEnd)"/>
  <rect x="492" y="746" width="300" height="91" rx="11" fill="#ffffff" stroke="#13a9c6" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="521" cy="774" r="17" fill="#13a9c6"/><text x="521" y="780" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text><text x="546" y="776" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">Future epoch</text><text x="510" y="806" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="510" dy="0">all participants wait</tspan><tspan x="510" dy="17">for one timestamp</tspan></text>
  <line x1="800" y1="792" x2="896" y2="792" stroke="#13a9c6" stroke-width="4" marker-end="url(#arrowEnd)"/>
  <rect x="906" y="746" width="300" height="91" rx="11" fill="#ffffff" stroke="#6748d6" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="935" cy="774" r="17" fill="#6748d6"/><text x="935" y="780" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">3</text><text x="960" y="776" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">90-second arm</text><text x="924" y="806" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="924" dy="0">fixed payloads</tspan><tspan x="924" dy="17">application records</tspan></text>
  <line x1="1214" y1="792" x2="1310" y2="792" stroke="#6748d6" stroke-width="4" marker-end="url(#arrowEnd)"/>
  <rect x="1320" y="746" width="300" height="91" rx="11" fill="#ffffff" stroke="#149447" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="1349" cy="774" r="17" fill="#149447"/><text x="1349" y="780" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">4</text><text x="1374" y="776" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">After snapshot</text><text x="1338" y="806" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="1338" dy="0">same counters</tspan><tspan x="1338" dy="17">complete marker</tspan></text>

  <text x="48" y="918" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="27" font-weight="800" fill="#14213d">Four measurement layers answer different questions</text>
  <rect x="48" y="944" width="395" height="164" rx="12" fill="#f4f0ff" stroke="#6748d6" stroke-width="2.5" filter="url(#softShadow)"/><text x="66" y="975" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#6748d6">1. Application</text><text x="66" y="1003" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="66" dy="0">NCCL GB/s, bus GB/s, iterations</tspan><tspan x="66" dy="21">GDS GiB/s, latency, XferType</tspan><tspan x="66" dy="21">primary performance evidence</tspan></text>
  <rect x="483" y="944" width="395" height="164" rx="12" fill="#edf2ff" stroke="#3767e8" stroke-width="2.5" filter="url(#softShadow)"/><text x="501" y="975" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#3767e8">2. Runtime path</text><text x="501" y="1003" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="501" dy="0">AWS Libfabric + GDRDMA</tspan><tspan x="501" dy="21">XferType: GPUD; fallback off</tspan><tspan x="501" dy="21">zero socket fallback</tspan></text>
  <rect x="918" y="944" width="395" height="164" rx="12" fill="#eafafd" stroke="#13a9c6" stroke-width="2.5" filter="url(#softShadow)"/><text x="936" y="975" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#13a9c6">3. Host transport</text><text x="936" y="1003" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="936" dy="0">EFA counter deltas per NIC</tspan><tspan x="936" dy="21">nvidia_fs and LNet health</tspan><tspan x="936" dy="21">aggregate correlation evidence</tspan></text>
  <rect x="1353" y="944" width="399" height="164" rx="12" fill="#edf9f1" stroke="#149447" stroke-width="2.5" filter="url(#softShadow)"/><text x="1371" y="975" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#149447">4. Service context</text><text x="1371" y="1003" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="1371" dy="0">FSx CloudWatch at 1 minute</tspan><tspan x="1371" dy="21">optional DCGM GPU context</tspan><tspan x="1371" dy="21">corroborating, not attribution</tspan></text>

  <rect x="48" y="1147" width="1030" height="123" rx="12" fill="#14213d" stroke="#14213d" stroke-width="2"/>
  <text x="78" y="1180" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#f1a208">CALCULATE</text>
  <text x="220" y="1180" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#ffffff">counter delta = after - before</text>
  <text x="78" y="1217" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#13a9c6">COMPARE</text>
  <text x="220" y="1217" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#ffffff">change % = (overlap - isolated) / isolated x 100</text>
  <text x="78" y="1254" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#149447">INTERPRET</text>
  <text x="220" y="1254" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="700" fill="#ffffff">application metrics measure impact; transport metrics prove the path</text>

  <rect x="1118" y="1147" width="634" height="123" rx="12" fill="#fff8df" stroke="#f1a208" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1146" y="1181" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="21" font-weight="800" fill="#f1a208">Attribution boundary</text>
  <text x="1146" y="1214" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="750" fill="#14213d"><tspan x="1146" dy="0">EFA counters are cumulative per NIC and port.</tspan><tspan x="1146" dy="20">Isolation plus timestamps supports correlation;</tspan><tspan x="1146" dy="20">it is not per-process or per-container accounting.</tspan></text>
</svg>
