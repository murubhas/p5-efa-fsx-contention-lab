  <rect width="1800" height="1320" fill="#fbfcfe"/>

  <text x="900" y="55" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="39" font-weight="800" fill="#14213d">NCCL collectives and GPUD checkpoint writes share the EFA fabric</text>
  <text x="900" y="91" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="19" font-weight="700" fill="#53627a">One controlled 90-second run per arm on the same two-node Spot P5 allocation</text>
  <rect x="1515" y="82" width="230" height="34" rx="17" fill="#edf9f1" stroke="#149447" stroke-width="2"/>
  <text x="1630" y="105" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="800" fill="#149447">PATHS VALIDATED</text>

  <rect x="55" y="125" width="330" height="91" rx="11" fill="#ffffff" stroke="#6748d6" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="84" cy="153" r="17" fill="#6748d6"/><text x="84" y="159" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">A</text><text x="109" y="155" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">NCCL only</text><text x="73" y="185" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="73" dy="0">16 ranks</tspan><tspan x="73" dy="17">256 MiB/rank</tspan></text>
  <line x1="393" y1="171" x2="477" y2="171" stroke="#6748d6" stroke-width="4" marker-end="url(#arrowEnd)"/>
  <rect x="487" y="125" width="350" height="91" rx="11" fill="#ffffff" stroke="#f1a208" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="516" cy="153" r="17" fill="#f1a208"/><text x="516" y="159" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">B</text><text x="541" y="155" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">Checkpoint only</text><text x="505" y="185" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="505" dy="0">2 GPUD writers</tspan><tspan x="505" dy="17">one per node</tspan></text>
  <line x1="845" y1="171" x2="929" y2="171" stroke="#f1a208" stroke-width="4" marker-end="url(#arrowEnd)"/>
  <rect x="939" y="125" width="390" height="91" rx="11" fill="#ffffff" stroke="#d83742" stroke-width="2.5" filter="url(#softShadow)"/><circle cx="968" cy="153" r="17" fill="#d83742"/><text x="968" y="159" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#ffffff">C</text><text x="993" y="155" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">Synchronized overlap</text><text x="957" y="185" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="700" fill="#53627a"><tspan x="957" dy="0">same parameters</tspan><tspan x="957" dy="17">shared start epoch</tspan></text>
  <rect x="1365" y="125" width="380" height="91" rx="11" fill="#edf2ff" stroke="#3767e8" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1555" y="156" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#3767e8">Experiment boundary</text>
  <text x="1555" y="181" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="13" font-weight="700" fill="#14213d"><tspan x="1555" dy="0">Synthetic data-plane benchmark</tspan><tspan x="1555" dy="18">not a full checkpoint serializer</tspan></text>

  <rect x="50" y="265" width="750" height="405" rx="16" fill="#edf2ff" stroke="#3767e8" stroke-width="3" filter="url(#softShadow)"/>
