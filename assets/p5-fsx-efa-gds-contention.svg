  <text x="770" y="307" text-anchor="end" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">8 H100 | 32 EFA</text>
  <rect x="80" y="340" width="330" height="142" rx="12" fill="#ffffff" stroke="#6748d6" stroke-width="2.5" filter="url(#softShadow)"/><text x="98" y="371" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#6748d6">Distributed trainer</text><text x="98" y="399" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="98" dy="0">Ranks 0-7</tspan><tspan x="98" dy="21">NCCL all-reduce</tspan><tspan x="98" dy="21">NVSwitch inside node</tspan></text>
  <rect x="440" y="340" width="330" height="142" rx="12" fill="#ffffff" stroke="#f1a208" stroke-width="2.5" filter="url(#softShadow)"/><text x="458" y="371" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#f1a208">Checkpoint writer</text><text x="458" y="399" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="458" dy="0">GPU 0 | 4 threads</tspan><tspan x="458" dy="21">cuFile + nvidia_fs</tspan><tspan x="458" dy="21">XferType: GPUD</tspan></text>
  <rect x="80" y="510" width="690" height="116" rx="11" fill="#ffffff" stroke="#13a9c6" stroke-width="2"/>
  <text x="425" y="541" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#13a9c6">EFA device layer</text>
  <text x="425" y="574" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">aws-ofi-nccl + libfabric | Lustre + kefalnd</text>
  <text x="425" y="603" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="700" fill="#53627a">32 local EFA rails; zero errors or drops</text>

  <rect x="1000" y="265" width="750" height="405" rx="16" fill="#eafafd" stroke="#13a9c6" stroke-width="3" filter="url(#softShadow)"/>
  <text x="1028" y="307" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="29" font-weight="800" fill="#13a9c6">P5 worker B</text>
  <text x="1720" y="307" text-anchor="end" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">8 H100 | 32 EFA</text>
  <rect x="1030" y="340" width="330" height="142" rx="12" fill="#ffffff" stroke="#6748d6" stroke-width="2.5" filter="url(#softShadow)"/><text x="1048" y="371" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#6748d6">Distributed trainer</text><text x="1048" y="399" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="1048" dy="0">Ranks 8-15</tspan><tspan x="1048" dy="21">NCCL all-reduce</tspan><tspan x="1048" dy="21">NVSwitch inside node</tspan></text>
  <rect x="1390" y="340" width="330" height="142" rx="12" fill="#ffffff" stroke="#f1a208" stroke-width="2.5" filter="url(#softShadow)"/><text x="1408" y="371" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#f1a208">Checkpoint writer</text><text x="1408" y="399" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="650" fill="#14213d"><tspan x="1408" dy="0">GPU 0 | 4 threads</tspan><tspan x="1408" dy="21">cuFile + nvidia_fs</tspan><tspan x="1408" dy="21">XferType: GPUD</tspan></text>
  <rect x="1030" y="510" width="690" height="116" rx="11" fill="#ffffff" stroke="#13a9c6" stroke-width="2"/>
  <text x="1375" y="541" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="20" font-weight="800" fill="#13a9c6">EFA device layer</text>
  <text x="1375" y="574" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">aws-ofi-nccl + libfabric | Lustre + kefalnd</text>
  <text x="1375" y="603" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="700" fill="#53627a">32 local EFA rails; zero errors or drops</text>

  <line x1="808" y1="401" x2="992" y2="401" stroke="#6748d6" stroke-width="8" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)"/>
  <text x="900" y="350" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#6748d6"><tspan x="900" dy="0">NCCL collective</tspan><tspan x="900" dy="22">EFA / SRD</tspan><tspan x="900" dy="22">GPUDirect RDMA</tspan></text>

  <line x1="536" y1="633" x2="741" y2="748" stroke="#f1a208" stroke-width="6" marker-end="url(#arrowEnd)"/>
  <line x1="1264" y1="633" x2="1059" y2="748" stroke="#f1a208" stroke-width="6" marker-end="url(#arrowEnd)"/>
  <rect x="610" y="720" width="580" height="138" rx="15" fill="#fff8df" stroke="#f1a208" stroke-width="3" filter="url(#softShadow)"/>
  <text x="900" y="758" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="25" font-weight="800" fill="#f1a208">EFA-enabled FSx for Lustre</text>
  <text x="900" y="791" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">Persistent 2 SSD | Lustre 2.15 | 19,200 GiB</text>
  <text x="900" y="824" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#53627a">Logical write path: H100 VRAM -&gt; cuFile -&gt; EFA -&gt; shared filesystem</text>

  <rect x="50" y="895" width="1090" height="276" rx="15" fill="#ffffff" stroke="#7a8baa" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="78" y="935" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="27" font-weight="800" fill="#14213d">Measured result</text>
  <text x="405" y="979" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#53627a">ISOLATED</text>
  <text x="630" y="979" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#53627a">OVERLAP</text>
  <text x="855" y="979" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#53627a">CHANGE</text>
  <line x1="78" y1="991" x2="1110" y2="991" stroke="#dce3ef" stroke-width="2"/>
  <text x="82" y="1027" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">NCCL payload</text>
  <text x="405" y="1027" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">166.570 GB/s</text>
  <text x="630" y="1027" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">163.455 GB/s</text>
  <text x="855" y="1027" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#149447">-1.87%</text>
  <text x="82" y="1075" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">GPUD write</text>
  <text x="405" y="1075" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">6.625 GiB/s</text>
  <text x="630" y="1075" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">5.660 GiB/s</text>
  <text x="855" y="1075" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#d83742">-14.57%</text>
  <text x="82" y="1123" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">GPUD mean latency</text>
  <text x="405" y="1123" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">1.180 ms</text>
  <text x="630" y="1123" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="800" fill="#14213d">1.381 ms</text>
  <text x="855" y="1123" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="18" font-weight="800" fill="#d83742">+17.02%</text>
  <rect x="928" y="1005" width="184" height="129" rx="10" fill="#edf9f1" stroke="#149447" stroke-width="2"/>
  <text x="1020" y="1037" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="14" font-weight="800" fill="#149447">PASS GATES</text>
  <text x="1020" y="1065" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="750" fill="#14213d"><tspan x="1020" dy="0">16/16 ranks</tspan><tspan x="1020" dy="18">GPUD both nodes</tspan><tspan x="1020" dy="18">no socket fallback</tspan><tspan x="1020" dy="18">zero errors/drops</tspan></text>

  <rect x="1170" y="895" width="580" height="276" rx="15" fill="#f4f0ff" stroke="#6748d6" stroke-width="2.5" filter="url(#softShadow)"/>
  <text x="1198" y="935" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="27" font-weight="800" fill="#6748d6">Counter signatures</text>
  <text x="1200" y="983" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#6748d6">NCCL only</text>
  <text x="1340" y="983" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#14213d">rdma_write_bytes dominated</text>
  <text x="1200" y="1023" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#f1a208">GPUD only</text>
  <text x="1340" y="1023" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#14213d">rdma_read_resp_bytes dominated</text>
  <text x="1200" y="1063" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="800" fill="#d83742">Overlap</text>
  <text x="1340" y="1063" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="700" fill="#14213d">both signatures appeared</text>
  <rect x="1195" y="1092" width="530" height="54" rx="8" fill="#ffffff" stroke="#6748d6" stroke-width="2"/>
  <text x="1460" y="1114" text-anchor="middle" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="12" font-weight="750" fill="#53627a"><tspan x="1460" dy="0">NIC counters are aggregate evidence,</tspan><tspan x="1460" dy="17">not universal per-process attribution</tspan></text>

  <rect x="50" y="1208" width="1700" height="76" rx="12" fill="#14213d" stroke="#14213d" stroke-width="2"/>
  <text x="78" y="1241" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#f1a208">TAKEAWAY</text>
  <text x="214" y="1241" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="17" font-weight="700" fill="#ffffff">Storage absorbed more contention in this run: async checkpointing still needs rate limits, staggering, and real-workload validation.</text>
  <text x="78" y="1269" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="15" font-weight="800" fill="#13a9c6">BOUNDARY</text>
  <text x="214" y="1269" text-anchor="start" font-family="Chalkboard SE, Comic Sans MS, ui-rounded, sans-serif" font-size="16" font-weight="700" fill="#ffffff">One synthetic run per arm; retain the topology and repeat before turning the delta into a production SLO.</text>
</svg>